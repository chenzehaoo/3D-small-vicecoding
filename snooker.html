<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 第一人称斯诺克</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; font-family: Arial, sans-serif; }
  canvas { display: block; }

  #crosshair {
    position: fixed; top: 50%; left: 50%;
    width: 6px; height: 6px;
    background: rgba(255,255,255,0.8);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
  }

  #power-bar-container {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%);
    width: 280px; height: 16px;
    background: rgba(0,0,0,0.7);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 8px;
    overflow: hidden;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.15s;
  }
  #power-bar-container.active { opacity: 1; }
  #power-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4caf50, #ffeb3b, #ff5722);
    border-radius: 6px;
    transition: width 0.03s linear;
  }

  #hud {
    position: fixed; top: 20px; left: 20px;
    color: #fff; font-size: 16px;
    background: rgba(0,0,0,0.6);
    padding: 12px 18px; border-radius: 8px;
    z-index: 10;
    line-height: 1.8;
    pointer-events: none;
  }
  #hud .label { color: #aaa; }
  #hud .target-red { color: #ff4444; font-weight: bold; }
  #hud .target-color { color: #ffdd44; font-weight: bold; }
  #message {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff; font-size: 32px; font-weight: bold;
    text-shadow: 0 0 20px rgba(0,0,0,0.8);
    pointer-events: none; z-index: 20;
    opacity: 0;
    transition: opacity 0.3s;
  }

  #help {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    z-index: 10;
    pointer-events: none;
    display: flex;
    gap: 24px;
    background: rgba(0,0,0,0.55);
    padding: 10px 22px;
    border-radius: 8px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.12);
  }
  #help .ctrl {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  #help .icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px; height: 24px;
    background: rgba(255,255,255,0.12);
    border-radius: 5px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.5px;
  }
  #help .icon.lmb { width: 38px; }
  #help .icon.rmb { width: 38px; }
  #help .icon.mwheel { font-size: 15px; }

  #lock-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.3s;
  }
  #lock-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #lock-overlay span {
    color: #fff;
    font-size: 22px;
    background: rgba(0,0,0,0.7);
    padding: 14px 32px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="crosshair"></div>
<div id="power-bar-container"><div id="power-bar-fill"></div></div>
<div id="hud">
  <div><span class="label">目标:</span> <span id="target-color" class="target-red">开球 — 打红球</span></div>
  <div><span class="label">剩余红球:</span> <span id="reds-remaining">15</span></div>
  <div><span class="label">得分:</span> <span id="score">0</span></div>
</div>
<div id="message"></div>
<div id="help">
  <div class="ctrl"><span class="icon">&#8201;⇢&#8201;</span> 移动瞄准</div>
  <div class="ctrl"><span class="icon lmb">按住</span> 蓄力击球</div>
  <div class="ctrl"><span class="icon rmb">按住</span> 旋转视角</div>
  <div class="ctrl"><span class="icon mwheel">↕</span> 缩放</div>
  <div class="ctrl"><span class="icon">ESC</span> 释放鼠标</div>
</div>
<div id="lock-overlay"><span>点击屏幕开始游戏（鼠标锁定模式）</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ==================== CONSTANTS ====================
const TABLE_LENGTH = 3.5;
const TABLE_WIDTH = 1.75;
const TABLE_HEIGHT = 0.85;
const CUSHION_HEIGHT = 0.04;
const CUSHION_THICK = 0.09;
const BALL_RADIUS = 0.02625;
const BALL_DIAMETER = BALL_RADIUS * 2;
const POCKET_RADIUS = 0.07;
const CORNER_POCKET_RADIUS = 0.08;
// ==================== PHYSICS CONSTANTS (calibrated to 350cm table) ====================
// Force → distance: force% × TABLE_LENGTH × MAX_SLIDE_RATIO = target slide distance
// Initial speed: v₀ = √(2 × CALIBRATION_FRICTION × targetDistance)
// This guarantees linear force-distance mapping per spec.
const CALIBRATION_FRICTION = 1.15;  // reference friction for force→distance calibration (m/s²)
const MAX_SLIDE_RATIO = 0.94;       // at 100% force, ball travels 94% of table length
const ROLLING_FRICTION_MAX = 1.65;  // final rolling deceleration on baize (m/s²)
const ROLLING_FRICTION_MIN = 0.38;  // initial sliding (low-friction glide) deceleration (m/s²)
const FRICTION_TRANSITION = 1.1;    // speed threshold for slide→roll transition (m/s)
const CUSHION_RESTITUTION = 0.78;   // cushion normal rebound — realistic energy retention
const CUSHION_TANGENT_FRICTION = 0.16; // velocity loss parallel to cushion on impact
const BALL_RESTITUTION = 0.96;      // ball-ball elastic collision efficiency
const STOP_THRESHOLD = 0.0006;      // velocity below which ball is considered at rest
const CHARGE_TIME = 2.0;            // seconds holding LMB to reach 100% power
const SUBSTEPS = 6;                 // physics sub-steps per frame for accurate collisions

// ==================== FORCE → SPEED CALIBRATION ====================
// Maps force percentage (0-1) to initial ball speed such that:
//   20% → ~table/6   40% → ~table/3   60% → ~table/2
//   80% → ~2/3 table  100% → ~full table
function forceToSpeed(force) {
  if (force <= 0) return 0;
  const targetDist = force * TABLE_LENGTH * MAX_SLIDE_RATIO;
  return Math.sqrt(2 * CALIBRATION_FRICTION * targetDist);
}

const HALF_LENGTH = TABLE_LENGTH / 2;
const HALF_WIDTH = TABLE_WIDTH / 2;
const BOUND_X = HALF_LENGTH - BALL_RADIUS;
const BOUND_Z = HALF_WIDTH - BALL_RADIUS;
const TABLE_TOP_Y = TABLE_HEIGHT;
const SURFACE_THICKNESS = 0.025;
const SURFACE_TOP_Y = TABLE_TOP_Y + SURFACE_THICKNESS / 2; // actual playing surface top face (0.8625)
// Ball bottom = BALL_Y - BALL_RADIUS; minus 0.0005 compensates sphere tessellation gap
const BALL_Y = SURFACE_TOP_Y + BALL_RADIUS - 0.0005;

// ==================== PROCEDURAL TEXTURES ====================
function createBaizeTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');

  // Base green baize — exact original color
  ctx.fillStyle = '#0d5e2b';
  ctx.fillRect(0, 0, 512, 512);

  // Very subtle pixel noise for fabric nap (preserve overall color)
  const imageData = ctx.getImageData(0, 0, 512, 512);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const noise = (Math.random() - 0.5) * 8;
    data[i] = Math.min(255, Math.max(0, data[i] + noise));
    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
  }
  ctx.putImageData(imageData, 0, 0);

  // Subtle horizontal striations for felt direction
  for (let y = 0; y < 512; y += 3) {
    const alpha = 0.015 + Math.random() * 0.025;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(0, y, 512, 2);
  }

  return new THREE.CanvasTexture(canvas);
}

function createWoodTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');

  // Warm brown base — exact original rail top color
  ctx.fillStyle = '#6b4423';
  ctx.fillRect(0, 0, 512, 128);

  // Subtle vertical sin-wave color banding for wood grain
  const imageData = ctx.getImageData(0, 0, 512, 128);
  const data = imageData.data;
  for (let x = 0; x < 512; x++) {
    const variation = (Math.sin(x * 0.08) + Math.sin(x * 0.15) * 0.4) * 6;
    for (let y = 0; y < 128; y++) {
      const idx = (y * 512 + x) * 4;
      data[idx] = Math.min(255, Math.max(0, data[idx] + variation));
      data[idx + 1] = Math.min(255, Math.max(0, data[idx + 1] + variation * 0.5));
      data[idx + 2] = Math.min(255, Math.max(0, data[idx + 2] + variation * 0.2));
    }
  }
  ctx.putImageData(imageData, 0, 0);

  // Dark grain streaks via bezier curves — fewer and more subtle
  for (let i = 0; i < 20; i++) {
    const startX = Math.random() * 512;
    ctx.beginPath();
    ctx.moveTo(startX, 0);
    const cp1x = startX + (Math.random() - 0.5) * 50;
    const cp2x = startX + (Math.random() - 0.5) * 50;
    ctx.bezierCurveTo(cp1x, 32, cp2x, 96, startX + (Math.random() - 0.5) * 20, 128);
    ctx.strokeStyle = `rgba(30,15,0,${0.05 + Math.random() * 0.1})`;
    ctx.lineWidth = 0.5 + Math.random() * 1.2;
    ctx.stroke();
  }

  return new THREE.CanvasTexture(canvas);
}

const baizeTexture = createBaizeTexture();
baizeTexture.colorSpace = THREE.SRGBColorSpace;
baizeTexture.wrapS = THREE.RepeatWrapping;
baizeTexture.wrapT = THREE.RepeatWrapping;
baizeTexture.repeat.set(4, 2);

const woodTexture = createWoodTexture();
woodTexture.colorSpace = THREE.SRGBColorSpace;
woodTexture.wrapS = THREE.RepeatWrapping;
woodTexture.wrapT = THREE.RepeatWrapping;
woodTexture.repeat.set(2, 1);

// ==================== THREE.JS SETUP ====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 5, 20);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.05, 30);
camera.position.set(-1.2, TABLE_TOP_Y + 0.7, 1.2);
camera.lookAt(0, TABLE_TOP_Y, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.LinearToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// ==================== LIGHTS (uniform soft global illumination) ====================
// HemisphereLight: sky/ground ambient gradient, neutral white sky, subtle warm ground bounce
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x443322, 0.9);
scene.add(hemiLight);

// AmbientLight: uniform fill base — eliminates dead-black shadows, ensures even brightness
const ambientLight = new THREE.AmbientLight(0xffffff, 1.6);
scene.add(ambientLight);

// DirectionalLight: slightly off-vertical sun for natural shadow gradients, better texture definition
const sunLight = new THREE.DirectionalLight(0xffffff, 3.5);
sunLight.position.set(0.5, TABLE_TOP_Y + 3.5, 0.9);
sunLight.target.position.set(0, TABLE_TOP_Y, 0);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 15;
sunLight.shadow.camera.left = -4;
sunLight.shadow.camera.right = 4;
sunLight.shadow.camera.top = 2.5;
sunLight.shadow.camera.bottom = -2.5;
sunLight.shadow.bias = -0.00008;
sunLight.shadow.normalBias = 0.02;
sunLight.shadow.radius = 5;
scene.add(sunLight);
scene.add(sunLight.target);

// ==================== FLOOR ====================
// Procedural carpet texture
function createCarpetTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  // Dark base
  ctx.fillStyle = '#1a0f0a';
  ctx.fillRect(0, 0, 256, 256);

  // Fine pixel noise for carpet fiber
  const imageData = ctx.getImageData(0, 0, 256, 256);
  const d = imageData.data;
  for (let i = 0; i < d.length; i += 4) {
    const noise = (Math.random() - 0.5) * 16;
    d[i] = Math.min(255, Math.max(0, d[i] + noise));
    d[i + 1] = Math.min(255, Math.max(0, d[i + 1] + noise * 0.5));
    d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + noise * 0.3));
  }
  ctx.putImageData(imageData, 0, 0);

  // Subtle irregular loop texture
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 256;
    ctx.fillStyle = `rgba(0,0,0,${0.02 + Math.random() * 0.05})`;
    ctx.beginPath();
    ctx.arc(x, y, 1 + Math.random() * 3, 0, Math.PI * 2);
    ctx.fill();
  }

  return new THREE.CanvasTexture(canvas);
}

const carpetTexture = createCarpetTexture();
carpetTexture.wrapS = THREE.RepeatWrapping;
carpetTexture.wrapT = THREE.RepeatWrapping;
carpetTexture.repeat.set(4, 3);

const floorGeo = new THREE.PlaneGeometry(12, 12);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1f1510, roughness: 0.85, metalness: 0.05 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0.001;
floor.receiveShadow = true;
scene.add(floor);

// Carpet under table
const carpetGeo = new THREE.PlaneGeometry(5, 3.2);
const carpetMat = new THREE.MeshStandardMaterial({ map: carpetTexture, color: 0x141212, roughness: 0.95 });
const carpet = new THREE.Mesh(carpetGeo, carpetMat);
carpet.rotation.x = -Math.PI / 2;
carpet.position.y = 0.002;
carpet.receiveShadow = true;
scene.add(carpet);

// ==================== TABLE CONSTRUCTION ====================
const tableGroup = new THREE.Group();
scene.add(tableGroup);

// Playing surface
const surfaceGeo = new THREE.BoxGeometry(TABLE_LENGTH, 0.025, TABLE_WIDTH);
const surfaceMat = new THREE.MeshStandardMaterial({ color: 0x0d5e2b, map: baizeTexture, roughness: 0.82, metalness: 0.02 });
const surface = new THREE.Mesh(surfaceGeo, surfaceMat);
surface.position.y = TABLE_TOP_Y;
surface.receiveShadow = true;
surface.castShadow = true;
tableGroup.add(surface);

// Baulk line (white line on the table)
const baulkX = -HALF_LENGTH + 0.737;
const baulkGeo = new THREE.PlaneGeometry(0.008, TABLE_WIDTH - 0.04);
const baulkMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
const baulkLine = new THREE.Mesh(baulkGeo, baulkMat);
baulkLine.rotation.x = -Math.PI / 2;
baulkLine.position.set(baulkX, TABLE_TOP_Y + 0.013, 0);
tableGroup.add(baulkLine);

// D semicircle — behind baulk line toward near cushion (negative X side)
const dRadius = 0.292;
const dSegments = 48;
const dPts = [];
for (let i = 0; i <= dSegments; i++) {
  const angle = Math.PI / 2 + (Math.PI * i) / dSegments; // π/2 → 3π/2, cos ≤ 0 → toward -X (near cushion)
  dPts.push(new THREE.Vector3(baulkX + dRadius * Math.cos(angle), TABLE_TOP_Y + 0.0135, dRadius * Math.sin(angle)));
}
const dCurve = new THREE.CatmullRomCurve3(dPts, false);
const dGeo = new THREE.BufferGeometry().setFromPoints(dCurve.getPoints(100));
const dLine = new THREE.Line(dGeo, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 1, depthTest: true }));
tableGroup.add(dLine);

// D-area highlight (shown during cue ball placement)
const dShape = new THREE.Shape();
dShape.moveTo(0, 0);
for (let i = 0; i <= 48; i++) {
  const angle = Math.PI / 2 + (Math.PI * i) / 48;
  dShape.lineTo(dRadius * Math.cos(angle), dRadius * Math.sin(angle));
}
dShape.closePath();
const dHighlightGeo = new THREE.ShapeGeometry(dShape);
const dHighlightMat = new THREE.MeshBasicMaterial({ color: 0x4488ff, side: THREE.DoubleSide, transparent: true, opacity: 0.0, depthTest: true });
const dHighlight = new THREE.Mesh(dHighlightGeo, dHighlightMat);
dHighlight.rotation.x = -Math.PI / 2;
dHighlight.position.set(baulkX, TABLE_TOP_Y + 0.014, 0);
dHighlight.visible = false;
tableGroup.add(dHighlight);

// Spot markers removed — clean green baize with no auxiliary markings

// Cushions
const cushionMat = new THREE.MeshStandardMaterial({ color: 0x5c3a1e, map: woodTexture, roughness: 0.55, metalness: 0.05 });
const railTopMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, map: woodTexture, roughness: 0.45, metalness: 0.05 });
const pocketFacingMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3, metalness: 0.1 });
const pocketInnerMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.5, metalness: 0.05 });
const apronMat = new THREE.MeshStandardMaterial({ color: 0x5c3a1e, map: woodTexture, roughness: 0.55, metalness: 0.05 });
const legMat = new THREE.MeshStandardMaterial({ color: 0x3d2010, map: woodTexture, roughness: 0.45, metalness: 0.08 });

// Long cushions (along X, at Z edges)
const longCushionGeo = new THREE.BoxGeometry(TABLE_LENGTH, CUSHION_HEIGHT, CUSHION_THICK);
const rightCushion = new THREE.Mesh(longCushionGeo, cushionMat);
rightCushion.position.set(0, TABLE_TOP_Y + CUSHION_HEIGHT / 2, HALF_WIDTH + CUSHION_THICK / 2);
rightCushion.castShadow = true;
rightCushion.receiveShadow = true;
tableGroup.add(rightCushion);

const leftCushion = new THREE.Mesh(longCushionGeo, cushionMat);
leftCushion.position.set(0, TABLE_TOP_Y + CUSHION_HEIGHT / 2, -HALF_WIDTH - CUSHION_THICK / 2);
leftCushion.castShadow = true;
leftCushion.receiveShadow = true;
tableGroup.add(leftCushion);

// Short cushions (along Z, at X edges)
const shortCushionGeo = new THREE.BoxGeometry(CUSHION_THICK, CUSHION_HEIGHT, TABLE_WIDTH + CUSHION_THICK * 2);
const farCushion = new THREE.Mesh(shortCushionGeo, cushionMat);
farCushion.position.set(HALF_LENGTH + CUSHION_THICK / 2, TABLE_TOP_Y + CUSHION_HEIGHT / 2, 0);
farCushion.castShadow = true;
farCushion.receiveShadow = true;
tableGroup.add(farCushion);

const nearCushion = new THREE.Mesh(shortCushionGeo, cushionMat);
nearCushion.position.set(-HALF_LENGTH - CUSHION_THICK / 2, TABLE_TOP_Y + CUSHION_HEIGHT / 2, 0);
nearCushion.castShadow = true;
nearCushion.receiveShadow = true;
tableGroup.add(nearCushion);

// Cushion rail tops (the flat top surface of rails)
const longRailTopGeo = new THREE.BoxGeometry(TABLE_LENGTH, 0.012, CUSHION_THICK + 0.04);
const rightRailTop = new THREE.Mesh(longRailTopGeo, railTopMat);
rightRailTop.position.set(0, TABLE_TOP_Y + CUSHION_HEIGHT + 0.006, HALF_WIDTH + CUSHION_THICK / 2);
rightRailTop.castShadow = true;
tableGroup.add(rightRailTop);

const leftRailTop = new THREE.Mesh(longRailTopGeo, railTopMat);
leftRailTop.position.set(0, TABLE_TOP_Y + CUSHION_HEIGHT + 0.006, -HALF_WIDTH - CUSHION_THICK / 2);
leftRailTop.castShadow = true;
tableGroup.add(leftRailTop);

const shortRailTopGeo = new THREE.BoxGeometry(CUSHION_THICK + 0.04, 0.012, TABLE_WIDTH + CUSHION_THICK * 2);
const farRailTop = new THREE.Mesh(shortRailTopGeo, railTopMat);
farRailTop.position.set(HALF_LENGTH + CUSHION_THICK / 2, TABLE_TOP_Y + CUSHION_HEIGHT + 0.006, 0);
farRailTop.castShadow = true;
tableGroup.add(farRailTop);

const nearRailTop = new THREE.Mesh(shortRailTopGeo, railTopMat);
nearRailTop.position.set(-HALF_LENGTH - CUSHION_THICK / 2, TABLE_TOP_Y + CUSHION_HEIGHT + 0.006, 0);
nearRailTop.castShadow = true;
tableGroup.add(nearRailTop);

// Corner cap blocks — prevent sunken/depressed look at cushion intersections
const capGeo = new THREE.BoxGeometry(0.08, 0.025, 0.08);
const capY = TABLE_TOP_Y + CUSHION_HEIGHT + 0.012;
const capX = HALF_LENGTH + CUSHION_THICK / 2;
const capZ = HALF_WIDTH + CUSHION_THICK / 2;
const cornerPositions = [
  [-capX, capY, -capZ], [capX, capY, -capZ],
  [-capX, capY, capZ],  [capX, capY, capZ],
];
cornerPositions.forEach(([cx, cy, cz]) => {
  const cap = new THREE.Mesh(capGeo, railTopMat);
  cap.position.set(cx, cy, cz);
  cap.castShadow = true;
  tableGroup.add(cap);
});

// Corner miter fill blocks — 45-triangular fills bridging cushion gaps at corners
const miterGeo = new THREE.BoxGeometry(0.04, 0.025, 0.04);
cornerPositions.forEach(([cx, cy, cz]) => {
  const mx = cx > 0 ? cx - 0.06 : cx + 0.06;
  const mz = cz > 0 ? cz - 0.06 : cz + 0.06;
  const miter = new THREE.Mesh(miterGeo, railTopMat);
  miter.position.set(mx, cy - 0.002, mz);
  miter.castShadow = true;
  tableGroup.add(miter);
});

// Pocket facings — angled leather pieces at each pocket bridging cushion to pocket hole
const pocketPositionsFacing = [
  { x: -HALF_LENGTH - 0.04, z: -HALF_WIDTH - 0.02, rot: Math.PI / 4 },
  { x: -HALF_LENGTH - 0.04, z: HALF_WIDTH + 0.02, rot: -Math.PI / 4 },
  { x: HALF_LENGTH + 0.04, z: -HALF_WIDTH - 0.02, rot: -Math.PI / 4 },
  { x: HALF_LENGTH + 0.04, z: HALF_WIDTH + 0.02, rot: Math.PI / 4 },
  { x: 0, z: -HALF_WIDTH - CUSHION_THICK / 2 - 0.01, rot: 0 },
  { x: 0, z: HALF_WIDTH + CUSHION_THICK / 2 + 0.01, rot: Math.PI },
];
const facingGeo = new THREE.PlaneGeometry(0.06, 0.03);
pocketPositionsFacing.forEach(pf => {
  const facing = new THREE.Mesh(facingGeo, pocketFacingMat);
  facing.position.set(pf.x, TABLE_TOP_Y + CUSHION_HEIGHT - 0.005, pf.z);
  facing.rotation.x = -Math.PI / 2 + 0.5; // ~30 tilt from horizontal
  facing.rotation.z = pf.rot;
  facing.receiveShadow = true;
  tableGroup.add(facing);
});

// Pocket drop cylinders — simulate pocket bag opening depth

  { x: -HALF_LENGTH, z: -HALF_WIDTH, r: CORNER_POCKET_RADIUS },

// ==================== INPUT HANDLING (POINTER LOCK) ====================
let isPointerLocked = false;
const lockOverlay = document.getElementById('lock-overlay');

function requestLock() {
  renderer.domElement.requestPointerLock();
}

renderer.domElement.addEventListener('click', () => {
  if (!isPointerLocked) {
    requestLock();
  }
});

lockOverlay.addEventListener('click', () => {
  requestLock();
});

document.addEventListener('pointerlockchange', () => {
  isPointerLocked = document.pointerLockElement === renderer.domElement;
  if (isPointerLocked) {
    lockOverlay.classList.add('hidden');
  } else {
    lockOverlay.classList.remove('hidden');
    // Cancel any in-progress charge if lock is lost
    if (shotState === ShotState.CHARGING) {
      shotState = ShotState.AIMING;
      chargePower = 0;
      document.getElementById('power-bar-container').classList.remove('active');
      document.getElementById('power-bar-fill').style.width = '0%';
    }
    isRightDragging = false;
  }
});

document.addEventListener('mousemove', (e) => {
  if (!isPointerLocked) return;

  const dx = e.movementX;
  const dy = e.movementY;

  // Cue ball placement mode: mouse moves the white ball within D-area
  if (placingCueBall && !isRightDragging) {
    const moveScale = 0.0006;
    // Get camera basis vectors projected to horizontal plane
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    camDir.y = 0;
    camDir.normalize();
    const camRight = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();

    // Map mouse delta to world movement
    let newX = cueBall.position.x + (camDir.x * dy + camRight.x * dx) * moveScale;
    let newZ = cueBall.position.z + (camDir.z * dy + camRight.z * dx) * moveScale;

    // Constrain to D-area: behind baulk line, within semicircle radius
    const bx = -1.013;
    const bz = 0;
    const maxDist = 0.292 - BALL_RADIUS;
    if (newX > bx) newX = bx;
    const dist = Math.hypot(newX - bx, newZ - bz);
    if (dist > maxDist) {
      const ang = Math.atan2(newZ - bz, newX - bx);
      newX = bx + Math.cos(ang) * maxDist;
      newZ = bz + Math.sin(ang) * maxDist;
    }
    // Also keep within table side bounds
    newZ = Math.max(-BOUND_Z, Math.min(BOUND_Z, newZ));
    newX = Math.max(-HALF_LENGTH + BALL_RADIUS, newX);

    cueBall.position.set(newX, BALL_Y, newZ);
    lastCueBallPos.copy(cueBall.position);
    return;
  }

  // Right-drag camera orbit → accumulate into target for smooth lerp
  if (isRightDragging) {
    targetCameraTheta += dx * 0.0025;
    targetCameraPhi += dy * 0.0025;
    targetCameraPhi = Math.max(0.15, Math.min(1.2, targetCameraPhi));
  }

  // Aim angle → accumulate into target for smooth lerp
  if ((shotState === ShotState.AIMING || shotState === ShotState.CHARGING) && gamePhase !== Phase.GAME_OVER && !placingCueBall) {
    targetAimAngle += dx * 0.002;
  }
});

    chargePower = 0;

});

// ==================== SHOOTING ====================
function shoot(power) {
  if (power < 0.02) {
    shotState = ShotState.AIMING;
    return;
  }

  // Break-off validation: only applies to the very first shot of the game
  if (isFirstShot) {
    const wx = cueBall.position.x;
    const wz = cueBall.position.z;
    const bx = -1.013;
    const inD = (wx <= bx) && (Math.hypot(wx - bx, wz) <= 0.292 + BALL_RADIUS);
    if (!inD) {
      showMessage('开球犯规：母球必须在D型区域内！');
      shotState = ShotState.AIMING;
      return;
    }
    isFirstShot = false; // 第一杆出杆后，彻底退出开球阶段
  }

  // Linear force→distance mapping: speed calibrated so ball slides target distance
  const speed = forceToSpeed(power);
  const vx = Math.cos(aimAngle) * speed;
  const vz = Math.sin(aimAngle) * speed;

  cueBall.userData.velocity.set(vx, vz);
  lastCueBallPos.copy(cueBall.position);

  // Reset per-shot tracking
  firstBallHit = null;
  ballsPocketedThisShot = [];
  foulThisShot = false;
  foulReason = '';

  // Detect if any ball is touching cue ball (for push shot foul detection)
  cueTouchingBall = null;
  for (const ball of balls) {
    if (ball === cueBall || ball.userData.pocketed) continue;
    const dist = Math.hypot(cueBall.position.x - ball.position.x, cueBall.position.z - ball.position.z);
    if (dist < BALL_DIAMETER + 0.0005) {
      cueTouchingBall = ball;
      break;
    }
  }

  // Hide cue
  cueGroup.visible = false;
}

// ==================== PHYSICS ====================
function getActiveBalls() {
  return balls.filter(b => !b.userData.pocketed);
}

function checkPockets(ball) {
  if (ball.userData.pocketed) return false;

  const bx = ball.position.x;
  const bz = ball.position.z;

  for (const pocket of pocketMarkers) {
    const dist = Math.hypot(bx - pocket.x, bz - pocket.z);
    if (dist < pocket.radius) {
      return true;
    }
  }
  return false;
}

function isNearAnyPocket(x, z) {
  for (const pocket of pocketMarkers) {
    if (Math.hypot(x - pocket.x, z - pocket.z) < pocket.radius + 0.04) {
      return true;
    }
  }
  return false;
}

function handleCushionBounce(ball) {
  const bx = ball.position.x;
  const bz = ball.position.z;
  const vel = ball.userData.velocity;
  let bounced = false;

  // Short cushions (X boundaries) — normal along X, tangent along Z (vel.y)
  if (bx > BOUND_X && !isNearAnyPocket(bx, bz)) {
    ball.position.x = BOUND_X;
    vel.x = -Math.abs(vel.x) * CUSHION_RESTITUTION;
    vel.y *= (1 - CUSHION_TANGENT_FRICTION);
    bounced = true;
  } else if (bx < -BOUND_X && !isNearAnyPocket(bx, bz)) {
    ball.position.x = -BOUND_X;
    vel.x = Math.abs(vel.x) * CUSHION_RESTITUTION;
    vel.y *= (1 - CUSHION_TANGENT_FRICTION);
    bounced = true;
  }

  // Long cushions (Z boundaries) — normal along Z (vel.y), tangent along X (vel.x)
  if (bz > BOUND_Z && !isNearAnyPocket(bx, bz)) {
    ball.position.z = BOUND_Z;
    vel.y = -Math.abs(vel.y) * CUSHION_RESTITUTION;
    vel.x *= (1 - CUSHION_TANGENT_FRICTION);
    bounced = true;
  } else if (bz < -BOUND_Z && !isNearAnyPocket(bx, bz)) {
    ball.position.z = -BOUND_Z;
    vel.y = Math.abs(vel.y) * CUSHION_RESTITUTION;
    vel.x *= (1 - CUSHION_TANGENT_FRICTION);
    bounced = true;
  }

  return bounced;
}

function physicsStep(dt) {
  const active = getActiveBalls();

  // Update positions
  for (const ball of active) {
    const vel = ball.userData.velocity;
    ball.position.x += vel.x * dt;
    ball.position.z += vel.y * dt; // vel.y stores Z velocity component
  }

  // Cushion bounces
  for (const ball of active) {
    handleCushionBounce(ball);
  }

  // Ball-ball collisions
  for (let i = 0; i < active.length; i++) {
    for (let j = i + 1; j < active.length; j++) {
      const a = active[i];
      const b = active[j];

      const dx = b.position.x - a.position.x;
      const dz = b.position.z - a.position.z;
      const dist = Math.hypot(dx, dz);

      if (dist < BALL_DIAMETER && dist > 0.0001) {
        // Track first ball cue ball hits after shot
        if (firstBallHit === null) {
          if (a === cueBall && b.userData.ballType !== 'white') firstBallHit = b;
          else if (b === cueBall && a.userData.ballType !== 'white') firstBallHit = a;
        }

        // Normalize collision normal
        const nx = dx / dist;
        const nz = dz / dist;

        // Separate overlapping balls
        const overlap = BALL_DIAMETER - dist;
        const sepX = nx * overlap / 2;
        const sepZ = nz * overlap / 2;
        a.position.x -= sepX;
        a.position.z -= sepZ;
        b.position.x += sepX;
        b.position.z += sepZ;

        // Relative velocity along collision normal
        const va = a.userData.velocity;
        const vb = b.userData.velocity;
        const dvx = va.x - vb.x;
        const dvz = va.y - vb.y;
        const dvn = dvx * nx + dvz * nz;

        // Only resolve if balls are approaching
        if (dvn > 0) {
          // Equal mass elastic collision (impulse = dvn)
          const impulse = dvn * (1 + BALL_RESTITUTION) / 2;
          va.x -= impulse * nx;
          va.y -= impulse * nz;
          vb.x += impulse * nx;
          vb.y += impulse * nz;
        }
      }
    }
  }

  // Rolling deceleration — slide→roll transition with speed-dependent friction.
  // High speed: low friction (ball slides/glides on cloth).
  // Low speed: higher friction (ball grips and rolls).
  // This produces a natural "glide, then gradual stop" feel — no harsh braking.
  for (const ball of active) {
    const vel = ball.userData.velocity;
    const speed = Math.hypot(vel.x, vel.y);
    if (speed > STOP_THRESHOLD) {
      // Smooth blend between sliding (low friction) and rolling (high friction)
      const blend = Math.min(speed / FRICTION_TRANSITION, 1.0);
      const effectiveFriction = ROLLING_FRICTION_MIN + (ROLLING_FRICTION_MAX - ROLLING_FRICTION_MIN) * (1 - blend);
      const newSpeed = Math.max(0, speed - effectiveFriction * dt);
      const scale = newSpeed / speed;
      vel.x *= scale;
      vel.y *= scale;
    } else {
      vel.set(0, 0);
    }
  }

  // Pocket detection — collect pocketed balls, defer rule evaluation
  for (const ball of active) {
    if (ball.userData.pocketed) continue;

    if (checkPockets(ball)) {
      ball.userData.pocketed = true;
      ball.visible = false;
      ballsPocketedThisShot.push(ball);
    }
  }
}

function respotColorBall(ball) {
  const spotPositions = {
    yellow: { x: -1.013, z: 0.292 },
    green: { x: -1.013, z: -0.292 },
    brown: { x: -1.013, z: 0 },
    blue: { x: 0, z: 0 },
    pink: { x: 0.875, z: 0 },
    black: { x: 1.426, z: 0 },
  };

  const spot = spotPositions[ball.userData.ballType];
  if (spot) {
    ball.position.set(spot.x, BALL_Y, spot.z);
    ball.userData.pocketed = false;
    ball.userData.velocity.set(0, 0);
    ball.visible = true;
  }
}

// ==================== SN00KER RULES ENGINE ====================
function getRequiredTarget() {
  switch (gamePhase) {
    case Phase.BREAK_OFF:
    case Phase.MUST_HIT_RED:
      return 'red';
    case Phase.MUST_HIT_COLOR:
      return 'any_color'; // player chooses any color
    case Phase.COLOR_CLEARANCE:
      return CLEARANCE_ORDER[clearanceIndex];
    default:
      return null;
  }
}

function getFoulPenaltyPoints(ballType) {
  // Foul minimum 4 points, or the ball's value if higher
  if (!ballType || ballType === 'white' || ballType === 'red') return 4;
  return Math.max(4, COLOR_POINTS[ballType] || 4);
}

function evaluateShot() {
  foulThisShot = false;
  foulReason = '';

  const cuePocketed = ballsPocketedThisShot.includes(cueBall);
  const otherPocketed = ballsPocketedThisShot.filter(b => b !== cueBall);

  // --- FOUL ②: Air shot — hit nothing ---
  if (firstBallHit === null && !cuePocketed && otherPocketed.length === 0) {
    foulThisShot = true;
    foulReason = '空杆犯规：未碰到任何球';
  }

  // --- FOUL ⑥: Push shot — cue ball was touching target at shot time ---
  if (cueTouchingBall !== null && firstBallHit === cueTouchingBall) {
    foulThisShot = true;
    foulReason = '贴球犯规：母球与目标球紧贴，禁止直接推杆击打';
  }

  // --- FOUL ①/④: Wrong target first hit ---
  const required = getRequiredTarget();
  if (firstBallHit !== null) {
    const hitType = firstBallHit.userData.ballType;

    if (required === 'red' && hitType !== 'red') {
      foulThisShot = true;
      foulReason = `犯规：应先打红球，却先碰到${getColorName(hitType)}`;
    } else if (required === 'any_color' && hitType === 'red') {
      foulThisShot = true;
      foulReason = '犯规：应先打彩球，却先碰到红球';
    } else if (required !== 'red' && required !== 'any_color' && required !== null) {
      // COLOR_CLEARANCE: must hit specific color
      if (hitType !== required) {
        foulThisShot = true;
        foulReason = `犯规：清台阶段应先打${getColorName(required)}，却先碰到${getColorName(hitType)}`;
      }
    }
  }

  // --- FOUL ③: Cue ball pocketed ---
  if (cuePocketed) {
    foulThisShot = true;
    foulReason = foulReason || '犯规：母球落袋';
  }

  // --- Evaluate pocketed balls ---
  let validPot = false;
  for (const ball of otherPocketed) {
    const ballType = ball.userData.ballType;

    if (gamePhase === Phase.BREAK_OFF || gamePhase === Phase.MUST_HIT_RED) {
      // Must pot red
      if (ballType === 'red') {
        redsRemaining--;
        score += 1;
        validPot = true;
      } else {
        // Color potted illegally — respot
        foulThisShot = true;
        foulReason = foulReason || '犯规：应打红球';
        respotColorBall(ball);
      }
    } else if (gamePhase === Phase.MUST_HIT_COLOR) {
      // Must pot a chosen color
      if (ballType !== 'red' && ballType !== 'white') {
        score += COLOR_POINTS[ballType] || 0;
        // Respot color if reds remain
        if (redsRemaining > 0) {
          respotColorBall(ball);
        }
        validPot = true;
      } else if (ballType === 'red') {
        foulThisShot = true;
        foulReason = foulReason || '犯规：应打彩球';
        redsRemaining--;
        // Red stays down (doesn't respot)
      }
    } else if (gamePhase === Phase.COLOR_CLEARANCE) {
      const expectedColor = CLEARANCE_ORDER[clearanceIndex];
      if (ballType === expectedColor) {
        score += COLOR_POINTS[ballType] || 0;
        clearanceIndex++;
        validPot = true;
      } else if (ballType !== 'red' && ballType !== 'white') {
        // Wrong color potted during clearance
        foulThisShot = true;
        foulReason = foulReason || `犯规：清台阶段应先打${getColorName(expectedColor)}`;
        respotColorBall(ball);
      }
    }
  }

  // --- Invalid pot (wrong ball pocketed without first-hit foul already) ---
  if (otherPocketed.length > 0 && !validPot && !foulThisShot) {
    foulThisShot = true;
    foulReason = foulReason || '犯规：不合规进球';
  }

  // --- Apply foul penalty ---
  if (foulThisShot) {
    const penaltyTarget = firstBallHit || (otherPocketed.length > 0 ? otherPocketed[0] : null);
    const penalty = getFoulPenaltyPoints(penaltyTarget ? penaltyTarget.userData.ballType : null);
    score = Math.max(0, score - penalty);
    showMessage(`${foulReason}  -${penalty}分`);
  } else if (validPot) {
    showMessage('有效进球！');
  }

  // --- Respot cue ball if pocketed ---
  if (cuePocketed) {
    cueBall.position.set(-1.18, BALL_Y, (Math.random() - 0.5) * 0.3);
    cueBall.userData.pocketed = false;
    cueBall.userData.velocity.set(0, 0);
    cueBall.visible = true;
    placingCueBall = true; // must re-place in D-area
  }

  // --- Phase transitions ---
  if (!foulThisShot && validPot) {
    switch (gamePhase) {
      case Phase.BREAK_OFF:
        gamePhase = Phase.MUST_HIT_COLOR; // red potted, now choose a color
        break;
      case Phase.MUST_HIT_RED:
        gamePhase = Phase.MUST_HIT_COLOR;
        break;
      case Phase.MUST_HIT_COLOR:
        if (redsRemaining <= 0) {
          gamePhase = Phase.COLOR_CLEARANCE;
          clearanceIndex = 0;
          showMessage('所有红球已清！进入清台阶段：黄→绿→棕→蓝→粉→黑');
        } else {
          gamePhase = Phase.MUST_HIT_RED;
        }
        break;
      case Phase.COLOR_CLEARANCE:
        if (clearanceIndex >= CLEARANCE_ORDER.length) {
          gamePhase = Phase.GAME_OVER;
          showMessage(`游戏结束！最终得分: ${score} 分`);
        }
        break;
    }
  } else if (foulThisShot) {
    // After a foul in break-off, return to break-off
    if (gamePhase === Phase.BREAK_OFF) {
      // Stay in break-off for re-shoot
    } else if (gamePhase === Phase.MUST_HIT_COLOR) {
      gamePhase = Phase.MUST_HIT_RED;
    } else if (gamePhase === Phase.COLOR_CLEARANCE) {
      // Stay in clearance phase
    }
    // MUST_HIT_RED stays MUST_HIT_RED after foul
  }

  // --- Check game over ---
  if (gamePhase === Phase.GAME_OVER) {
    showMessage(`游戏结束！最终得分: ${score} 分`);
  }
}

function getColorName(type) {
  const names = { yellow: '黄球', green: '绿球', brown: '棕球', blue: '蓝球', pink: '粉球', black: '黑球' };
  return names[type] || type;
}

function showMessage(msg) {
  messageText = msg;
  messageTimer = 2.0;
  const el = document.getElementById('message');
  el.textContent = msg;
  el.style.opacity = '1';
}

function allBallsStopped() {
  return getActiveBalls().every(b => {
    const v = b.userData.velocity;
    return Math.hypot(v.x, v.y) < STOP_THRESHOLD;
  });
}

// ==================== CUE UPDATE ====================
function updateCuePosition() {
  const cbPos = cueBall.userData.pocketed ? lastCueBallPos : cueBall.position;

  const dirX = Math.cos(aimAngle);
  const dirZ = Math.sin(aimAngle);

  // Cue tip position: just behind the cue ball
  const tipDistance = BALL_RADIUS + 0.005 + chargePower * 0.25;
  const tipX = cbPos.x - dirX * tipDistance;
  const tipZ = cbPos.z - dirZ * tipDistance;

  // Cue extends backward from tip
  const midX = tipX - dirX * 0.575;
  const midZ = tipZ - dirZ * 0.575;

  cueGroup.position.set(midX, BALL_Y + 0.008, midZ);
  cueGroup.rotation.order = 'YXZ';
  // Lay cylinder horizontal (was along Y), then point in aim direction
  cueGroup.rotation.y = Math.PI / 2 - aimAngle;
  cueGroup.rotation.x = -Math.PI / 2 - 0.04; // flat + slight downward tilt
}

// ==================== CAMERA UPDATE ====================
function updateCamera() {
  const cbPos = cueBall.userData.pocketed ? lastCueBallPos : cueBall.position;

  // Camera orbits around cue ball
  const camX = cbPos.x + cameraDistance * Math.cos(cameraPhi) * Math.sin(cameraTheta);
  const camY = cbPos.y + cameraDistance * Math.sin(cameraPhi);
  const camZ = cbPos.z + cameraDistance * Math.cos(cameraPhi) * Math.cos(cameraTheta);

  // Look target: slightly ahead of cue ball in aim direction when aiming
  let lookTarget;
  if (shotState === ShotState.AIMING || shotState === ShotState.CHARGING) {
    const lookX = cbPos.x + Math.cos(aimAngle) * 0.5;
    const lookZ = cbPos.z + Math.sin(aimAngle) * 0.5;
    lookTarget = new THREE.Vector3(lookX, BALL_Y, lookZ);
  } else {
    lookTarget = new THREE.Vector3(cbPos.x, BALL_Y, cbPos.z);
  }

  camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 0.15);
  camera.lookAt(
    camera.position.x + (lookTarget.x - camera.position.x) * 2,
    lookTarget.y,
    camera.position.z + (lookTarget.z - camera.position.z) * 2,
  );
}

// ==================== AIMING LINE ====================
const aimLineGeo = new THREE.BufferGeometry();
const aimLineMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.08, gapSize: 0.05, opacity: 0.5, transparent: true });
const aimLine = new THREE.Line(aimLineGeo, aimLineMat);
aimLine.visible = false;
scene.add(aimLine);

function updateAimLine() {
  if (shotState === ShotState.BALLS_MOVING) {
    aimLine.visible = false;
    return;
  }

  const cbPos = cueBall.userData.pocketed ? lastCueBallPos : cueBall.position;
  const dirX = Math.cos(aimAngle);
  const dirZ = Math.sin(aimAngle);

  const startX = cbPos.x + dirX * (BALL_RADIUS + 0.002);
  const startZ = cbPos.z + dirZ * (BALL_RADIUS + 0.002);
  const endX = cbPos.x + dirX * 2.5;
  const endZ = cbPos.z + dirZ * 2.5;

  const pts = [new THREE.Vector3(startX, BALL_Y + 0.001, startZ), new THREE.Vector3(endX, BALL_Y + 0.001, endZ)];
  aimLine.geometry.dispose();
  aimLine.geometry = new THREE.BufferGeometry().setFromPoints(pts);
  aimLine.visible = true;
  aimLine.computeLineDistances();
}

// ==================== HUD UPDATE ====================
function updateHUD() {
  const targetEl = document.getElementById('target-color');
  const redsEl = document.getElementById('reds-remaining');
  const scoreEl = document.getElementById('score');

  redsEl.textContent = redsRemaining;
  scoreEl.textContent = score;

  if (placingCueBall) {
    targetEl.textContent = '移动鼠标放置母球，左键确认';
    targetEl.className = 'target-color';
    return;
  }

  switch (gamePhase) {
    case Phase.BREAK_OFF:
      targetEl.textContent = '开球 — 打红球';
      targetEl.className = 'target-red';
      break;
    case Phase.MUST_HIT_RED:
      targetEl.textContent = '红球';
      targetEl.className = 'target-red';
      break;
    case Phase.MUST_HIT_COLOR:
      targetEl.textContent = '任选彩球';
      targetEl.className = 'target-color';
      break;
    case Phase.COLOR_CLEARANCE:
      const nextColor = CLEARANCE_ORDER[clearanceIndex];
      targetEl.textContent = `清台: ${getColorName(nextColor)} (${COLOR_POINTS[nextColor]}分)`;
      targetEl.className = 'target-color';
      break;
    case Phase.GAME_OVER:
      targetEl.textContent = `游戏结束 得分:${score}`;
      targetEl.className = 'target-color';
      break;
  }
}

// ==================== ANIMATION LOOP ====================
let lastTime = performance.now() / 1000;

function animate(timestamp) {
  requestAnimationFrame(animate);

  let rawDt = timestamp / 1000 - lastTime;
  lastTime = timestamp / 1000;

  // Clamp delta to avoid jumps
  const dt = Math.min(rawDt, 0.05);

  // Charge power
  if (shotState === ShotState.CHARGING) {
    const elapsed = lastTime - chargeStartTime;
    chargePower = Math.min(elapsed / CHARGE_TIME, 1.0);
    const pct = chargePower * 100;
    document.getElementById('power-bar-fill').style.width = pct + '%';
  }

  // Physics
  if (shotState === ShotState.BALLS_MOVING) {
    const subDt = dt / SUBSTEPS;
    for (let s = 0; s < SUBSTEPS; s++) {
      physicsStep(subDt);
    }

    // Track cue ball position
    if (!cueBall.userData.pocketed) {
      lastCueBallPos.copy(cueBall.position);
    }

    // Check if all balls stopped
    if (allBallsStopped()) {
      // Evaluate shot according to full snooker rules (once per shot)
      evaluateShot();

      if (!cueBall.userData.pocketed) {
        lastCueBallPos.copy(cueBall.position);
      }

      if (gamePhase === Phase.GAME_OVER) {
        // Transition out of BALLS_MOVING so we don't re-evaluate every frame
        shotState = ShotState.AIMING;
        cueGroup.visible = false;
      } else {
        shotState = ShotState.AIMING;
        cueGroup.visible = true;
      }
      // Sync aim target to current angle, prevent jump from stale mouse input
      targetAimAngle = aimAngle;
    }
  }

  // Message timer
  if (messageTimer > 0) {
    messageTimer -= dt;
    if (messageTimer <= 0) {
      document.getElementById('message').style.opacity = '0';
    }
  }

  // Update cue
  if (shotState !== ShotState.BALLS_MOVING && gamePhase !== Phase.GAME_OVER && !placingCueBall) {
    updateCuePosition();
  } else if (placingCueBall) {
    cueGroup.visible = false;
  }

  // Update aim line
  if (gamePhase !== Phase.GAME_OVER && !placingCueBall) {
    updateAimLine();
  } else if (placingCueBall) {
    aimLine.visible = false;
  }

  // Smooth aim angle — lerp toward raw input target (no instant snapping)
  const aimLerp = 0.10;
  aimAngle += (targetAimAngle - aimAngle) * aimLerp;

  // Smooth camera orbit angles — lerp toward raw input targets
  const camLerp = 0.09;
  cameraTheta += (targetCameraTheta - cameraTheta) * camLerp;
  cameraPhi += (targetCameraPhi - cameraPhi) * camLerp;

  // Auto-follow: when not manually orbiting, track behind aim direction
  if (shotState === ShotState.AIMING || shotState === ShotState.CHARGING) {
    if (!isRightDragging) {
      targetCameraTheta = -aimAngle - Math.PI / 2;
    }
  }

  // Update camera position
  updateCamera();

  // D-area highlight visibility (cue ball placement mode)
  if (placingCueBall && gamePhase !== Phase.GAME_OVER) {
    dHighlight.visible = true;
    dHighlight.material.opacity = Math.min(1, dHighlight.material.opacity + dt * 3);
  } else {
    dHighlight.material.opacity = Math.max(0, dHighlight.material.opacity - dt * 3);
    if (dHighlight.material.opacity <= 0.01) dHighlight.visible = false;
  }

  // Update HUD
  updateHUD();

  // Render
  renderer.render(scene, camera);
}

// ==================== INITIAL SETUP ====================
updateCuePosition();
updateAimLine();
updateHUD();
requestAnimationFrame(animate);
